<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Petal Gradient -->
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <!-- Center Disc Gradient -->
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="80%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g transform="translate(32,32)" filter="url(#glow)">
    <!-- 5 Petals -->
    <path d="M 0 0 C -12 -16, -10 -30, 0 -30 C 10 -30, 12 -16, 0 0 Z" fill="url(#petalGrad)"/>
    <path d="M 0 0 C -12 -16, -10 -30, 0 -30 C 10 -30, 12 -16, 0 0 Z" fill="url(#petalGrad)" transform="rotate(72)"/>
    <path d="M 0 0 C -12 -16, -10 -30, 0 -30 C 10 -30, 12 -16, 0 0 Z" fill="url(#petalGrad)" transform="rotate(144)"/>
    <path d="M 0 0 C -12 -16, -10 -30, 0 -30 C 10 -30, 12 -16, 0 0 Z" fill="url(#petalGrad)" transform="rotate(216)"/>
    <path d="M 0 0 C -12 -16, -10 -30, 0 -30 C 10 -30, 12 -16, 0 0 Z" fill="url(#petalGrad)" transform="rotate(288)"/>

    <!-- Flower Center Disc -->
    <circle cx="0" cy="0" r="9" fill="url(#centerGrad)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#FEF08A" opacity="0.8"/>
  </g>
</svg>